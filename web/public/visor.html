<!doctype html>
<html lang="es" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,700&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="core.css">
<style>
/* La hoja en el atril: papel marfil, tinta azul noche, notas en burdeos, acentos latón. */
:root,:root[data-theme="light"]{
  --bg:#ece4cf; --sheet:#fbf7ea; --ink:#1b2036; --muted:#6c6878; --line:#d8cdb0; --rule:#efe6cc; --margin:#e6c7b5;
  --note:#982a33; --beat-odd:#28388a; --beat-even:#2d6b4b; --hl:#f6e27a; --hl-ink:#1b2036; --cue:#982a33; --cue-bg:#f6e6dc; --now:#f6e3a3;
  color-scheme:light;
}
.sv-title{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-weight:700;text-transform:none;letter-spacing:0;text-decoration:none;font-size:1.6em}
.score h2.sv-title{margin:0 0 2px}
.page{box-shadow:0 1px 0 #fff inset,0 10px 24px -14px rgb(27 32 54 / .35)}
.rbar button.pri,.ed button.pri,.ed button.on{background:#1b2036!important;border-color:#1b2036!important;color:#f3e6bf!important}
.rbar button.ok{background:#7a2232!important;border-color:#7a2232!important;color:#fbf7ea!important}
.rbar button.sw,.rbar button.edon{border-color:#b08b33!important;color:#1b2036!important}
.rbar button.edon{background:#f3e6bf!important}
.ed{border-color:#b08b33!important}
.hint{color:#1b2036!important;background:#f3e6bf!important}
</style>
</head><body><div id="app"></div>
<script>window.onerror=function(m,src,l){ var a=document.getElementById("app"); if(a&&!a.children.length){ a.innerHTML='<p style="font:16px system-ui;color:#7a2232;padding:20px">No se ha podido abrir la partitura: '+String(m).replace(/</g,"&lt;")+' ('+String(src||"").split("/").pop()+':'+l+')</p>'; } };</script>
<script src="core.js"></script>
<script src="score.js"></script>
<script>
/* Recibe la canción de la página principal y le devuelve los cambios. */
var started=false,lastSong=null;
window.addEventListener("message",function(ev){
  if(ev.origin!==location.origin) return;
  var d=ev.data||{}; if(d.type!=="song") return;
  var key=d.song+"|"+(d.photos||[]).join(",");
  if(key===lastSong) return; lastSong=key;
  window.SONGS=[JSON.parse(d.song)]; window.EMBEDDED=true; window.EDITABLE=!!d.editable; window.PHOTOS=d.photos||[];
  window.onLocate=window.PHOTOS.length?function(){ parent.postMessage({type:"locate"},location.origin); }:null;
  window.onSongEdit=function(song){ parent.postMessage({type:"edit",song:song},location.origin); };
  if(!started){ started=true; var s=document.createElement("script"); s.src="viewer.js"; document.body.appendChild(s); }
  else if(window.__viewerStart) window.__viewerStart();
});
parent.postMessage({type:"visor-ready"},location.origin);
</script>
</body></html>
